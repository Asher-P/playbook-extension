<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playbook Scheduler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      background: #111b21;
      color: #e9edef;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      color: #00a884;
      margin-bottom: 14px;
      letter-spacing: .3px;
    }
    .section {
      background: #202c33;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: #8696a0;
      margin-bottom: 10px;
    }
    input[type="text"], input[type="datetime-local"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #2a3942;
      background: #2a3942;
      color: #e9edef;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus, input[type="datetime-local"]:focus {
      border-color: #00a884;
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1) brightness(.6);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-record  { background: #00a884; color: #fff; width: 100%; margin-top: 8px; }
    .btn-stop    { background: #f0423f; color: #fff; width: 100%; margin-top: 8px; }
    .btn-schedule{ background: #00a884; color: #fff; width: 100%; margin-top: 8px; }
    .btn-danger  { background: transparent; border: 1px solid #f0423f; color: #f0423f; padding: 4px 10px; font-size: 12px; }
    .btn-run     { background: transparent; border: 1px solid #00a884; color: #00a884; padding: 4px 10px; font-size: 12px; }
    .status-badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
      font-weight: 500;
    }
    .badge-recording { background: #f0423f22; color: #f0423f; }
    .badge-idle      { background: #8696a022; color: #8696a0; }
    .badge-scheduled { background: #00a88422; color: #00a884; }
    #stepCount {
      font-size: 12px;
      color: #8696a0;
      margin-top: 6px;
    }
    .playbook-list { list-style: none; }
    .playbook-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2a3942;
      gap: 8px;
    }
    .playbook-item:last-child { border-bottom: none; }
    .playbook-name {
      font-size: 13px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .playbook-meta {
      font-size: 11px;
      color: #8696a0;
    }
    .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
    #emptyState {
      font-size: 13px;
      color: #8696a0;
      text-align: center;
      padding: 8px 0;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f0423f;
      animation: pulse 1s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }
  </style>
</head>
<body>
  <h1>WhatsApp Playbook Scheduler</h1>

  <!-- RECORD -->
  <div class="section">
    <div class="section-title">
      1. Record Playbook
      <span id="recordBadge" class="status-badge badge-idle">Idle</span>
    </div>
    <input type="text" id="playbookName" placeholder="Playbook name…" />
    <p id="stepCount">0 steps recorded</p>
    <button id="btnRecord" class="btn btn-record">● Start Recording</button>
    <button id="btnStop"   class="btn btn-stop"   style="display:none">■ Stop &amp; Save</button>
  </div>

  <!-- SCHEDULE -->
  <div class="section">
    <div class="section-title">2. Schedule Playbook</div>
    <select id="playbookSelect" style="width:100%;padding:8px 10px;border-radius:6px;border:1px solid #2a3942;background:#2a3942;color:#e9edef;font-size:13px;outline:none;margin-bottom:8px;">
      <option value="">— select a playbook —</option>
    </select>
    <input type="datetime-local" id="scheduleTime" />
    <button id="btnSchedule" class="btn btn-schedule">⏰ Schedule</button>
  </div>

  <!-- SAVED PLAYBOOKS -->
  <div class="section">
    <div class="section-title">Saved Playbooks</div>
    <ul class="playbook-list" id="playbookList">
      <li id="emptyState" class="playbook-item"><span>No playbooks yet.</span></li>
    </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
